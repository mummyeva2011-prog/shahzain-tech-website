{% extends "base.html" %}
{% block title %}Create Account | SHAHZAIN TECH{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">✦</div>
    <p class="eyebrow">JOIN SHAHZAIN TECH</p>
    <h1>Create your <span>account.</span></h1>
    <p class="auth-subtitle">Start building something amazing with us.</p>

    <form method="post" class="auth-form">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

      <label for="username">Username</label>
      <input id="username" name="username" minlength="3" maxlength="24"
             placeholder="Choose a username" required autocomplete="username">

      <label for="email">Email Address</label>
      <div class="email-field">
        <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
        <input id="email" type="email" name="email" maxlength="254"
               placeholder="you@example.com" required autocomplete="email">
      </div>

      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" type="password" name="password"
               minlength="12" placeholder="At least 12 characters"
               required autocomplete="new-password">
        <button class="password-toggle" type="button"
                onclick="togglePassword('password', this)"
                aria-label="Show password" title="Show password">
          <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <label for="confirm_password">Confirm Password</label>
      <div class="password-field">
        <input id="confirm_password" type="password" name="confirm_password"
               minlength="12" placeholder="Enter password again"
               required autocomplete="new-password">
        <button class="password-toggle" type="button"
                onclick="togglePassword('confirm_password', this)"
                aria-label="Show password" title="Show password">
          <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="btn auth-submit" type="submit">Create Account →</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</section>

<script>
function togglePassword(id, button) {
  const field = document.getElementById(id);
  const isHidden = field.type === "password";
  field.type = isHidden ? "text" : "password";
  button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
  button.title = isHidden ? "Hide password" : "Show password";
  button.innerHTML = isHidden
    ? '<svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A11 11 0 0112 5c6.4 0 10 7 10 7a15 15 0 01-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 004-.8"/></svg>'
    : '<svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
}
</script>
{% endblock %}
